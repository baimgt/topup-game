<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08031a" />
      <stop offset="40%" stop-color="#140736" />
      <stop offset="80%" stop-color="#090524" />
      <stop offset="100%" stop-color="#03010d" />
    </linearGradient>

    <!-- Instagram Signature Gradient -->
    <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="25%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="75%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Neon Cyan & Purple Glows -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Cyber Grid Pattern -->
  <g opacity="0.12" stroke="#6366f1" stroke-width="1.5">
    <line x1="0" y1="75" x2="1200" y2="75" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="225" x2="1200" y2="225" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="375" x2="1200" y2="375" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="0" y1="600" x2="1200" y2="600" />

    <line x1="100" y1="0" x2="100" y2="675" />
    <line x1="200" y1="0" x2="200" y2="675" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="400" y1="0" x2="400" y2="675" />
    <line x1="500" y1="0" x2="500" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="700" y1="0" x2="700" y2="675" />
    <line x1="800" y1="0" x2="800" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
    <line x1="1000" y1="0" x2="1000" y2="675" />
    <line x1="1100" y1="0" x2="1100" y2="675" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="180" r="280" fill="#a855f7" opacity="0.18" filter="blur(60px)" />
  <circle cx="1000" cy="400" r="320" fill="#ec4899" opacity="0.22" filter="blur(70px)" />
  <circle cx="850" cy="220" r="200" fill="#06b6d4" opacity="0.15" filter="blur(50px)" />

  <!-- Outer Neon Border Frame -->
  <rect x="24" y="24" width="1152" height="627" rx="32" fill="none" stroke="url(#igGrad)" stroke-width="3" opacity="0.85" filter="url(#glowPink)" />
  <rect x="24" y="24" width="1152" height="627" rx="32" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />

  <!-- ================= LEFT COLUMN: HERO TEXT & BADGES ================= -->
  
  <!-- Top Pill Badge -->
  <g transform="translate(80, 80)">
    <rect width="260" height="42" rx="21" fill="url(#badgeGrad)" filter="url(#glowPink)" opacity="0.9" />
    <text x="130" y="27" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle" class="font-sans" letter-spacing="2">
      🔥 PROMO EKSKLUSIF
    </text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 190)" class="font-sans">
    <text x="0" y="0" fill="#ffffff" font-size="52" font-weight="900" letter-spacing="-1" filter="url(#dropShadow)">
      FOLLOW INSTAGRAM KAMI!
    </text>
    <text x="0" y="62" fill="url(#cyanGrad)" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#glowCyan)">
      DAPATKAN DISKON SPESIAL
    </text>
  </g>

  <!-- Subheadline & Benefits list -->
  <g transform="translate(80, 310)" class="font-sans">
    <text x="0" y="0" fill="#cbd5e1" font-size="20" font-weight="500">
      Jangan lewatkan giveaway diamond, flash sale kilat &amp; kode voucher!
    </text>
  </g>

  <!-- Benefit Cards Checklist -->
  <g transform="translate(80, 350)" class="font-sans">
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <rect width="480" height="48" rx="12" fill="#180c38" stroke="#3b2064" stroke-width="1.5" />
      <circle cx="28" cy="24" r="12" fill="#4ade80" />
      <path d="M22 24l4 4 8-8" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="54" y="30" fill="#f8fafc" font-size="16" font-weight="700">Kode Promo Diskon Hingga 70% Setiap Hari</text>
    </g>
    <!-- Item 2 -->
    <g transform="translate(0, 60)">
      <rect width="480" height="48" rx="12" fill="#180c38" stroke="#3b2064" stroke-width="1.5" />
      <circle cx="28" cy="24" r="12" fill="#4ade80" />
      <path d="M22 24l4 4 8-8" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="54" y="30" fill="#f8fafc" font-size="16" font-weight="700">Giveaway Diamond MLBB, FF &amp; UC PUBG Mingguan</text>
    </g>
    <!-- Item 3 -->
    <g transform="translate(0, 120)">
      <rect width="480" height="48" rx="12" fill="#180c38" stroke="#3b2064" stroke-width="1.5" />
      <circle cx="28" cy="24" r="12" fill="#4ade80" />
      <path d="M22 24l4 4 8-8" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="54" y="30" fill="#f8fafc" font-size="16" font-weight="700">Info Event Game &amp; Update Harga Termurah</text>
    </g>
  </g>

  <!-- CTA Box: Instagram Username Callout -->
  <g transform="translate(80, 545)" class="font-sans">
    <rect width="480" height="62" rx="16" fill="url(#igGrad)" filter="url(#glowPink)" />
    <rect x="2" y="2" width="476" height="58" rx="14" fill="#0b071e" opacity="0.2" />
    
    <!-- Mini IG icon -->
    <g transform="translate(24, 15) scale(0.65)">
      <rect width="48" height="48" rx="14" fill="none" stroke="#ffffff" stroke-width="4.5" />
      <circle cx="24" cy="24" r="11" fill="none" stroke="#ffffff" stroke-width="4.5" />
      <circle cx="36" cy="12" r="3" fill="#ffffff" />
    </g>

    <text x="75" y="39" fill="#ffffff" font-size="24" font-weight="900" letter-spacing="1">
      @gamerstore
    </text>
    <text x="445" y="38" fill="#facc15" font-size="16" font-weight="800" text-anchor="end" letter-spacing="0.5">
      FOLLOW SEKARANG ➔
    </text>
  </g>

  <!-- ================= RIGHT COLUMN: 3D INSTAGRAM & GAMING ASSETS ================= -->
  
  <!-- Glowing 3D Base Platform -->
  <ellipse cx="920" cy="510" rx="200" ry="45" fill="url(#cyanGrad)" opacity="0.35" filter="url(#glowCyan)" />
  <ellipse cx="920" cy="505" rx="150" ry="30" fill="#ec4899" opacity="0.4" filter="url(#glowPink)" />

  <!-- Giant 3D Holographic Instagram Icon -->
  <g transform="translate(780, 160)" filter="url(#dropShadow)">
    <!-- Back Glow Card -->
    <rect x="-10" y="-10" width="280" height="280" rx="68" fill="url(#igGrad)" opacity="0.3" filter="blur(20px)" />
    
    <!-- Outer Main Rounded Square -->
    <rect width="260" height="260" rx="62" fill="url(#igGrad)" filter="url(#glowPink)" />
    
    <!-- Inner Dark Glass Reflection -->
    <rect x="8" y="8" width="244" height="244" rx="54" fill="#0f0728" opacity="0.15" />
    <path d="M20 60 Q 130 10 240 60 L 240 180 Q 130 240 20 180 Z" fill="#ffffff" opacity="0.08" />

    <!-- Camera Outline -->
    <rect x="42" y="42" width="176" height="176" rx="44" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
    <!-- Lens Circle -->
    <circle cx="130" cy="130" r="46" fill="none" stroke="#ffffff" stroke-width="16" />
    <!-- Flash Dot -->
    <circle cx="182" cy="78" r="12" fill="#ffffff" />
  </g>

  <!-- Floating 3D Gaming Diamond 1 (Cyan) -->
  <g transform="translate(710, 100) scale(1.1)" filter="url(#glowCyan)">
    <polygon points="40,0 80,30 40,90 0,30" fill="url(#cyanGrad)" opacity="0.9" />
    <polygon points="40,0 40,90 80,30" fill="#93c5fd" opacity="0.75" />
    <polygon points="40,0 40,90 0,30" fill="#38bdf8" opacity="0.95" />
    <line x1="0" y1="30" x2="80" y2="30" stroke="#ffffff" stroke-width="2" opacity="0.8" />
  </g>

  <!-- Floating 3D Gaming Diamond 2 (Purple) -->
  <g transform="translate(1030, 150) scale(0.85)" filter="url(#glowPink)">
    <polygon points="40,0 80,30 40,90 0,30" fill="url(#igGrad)" opacity="0.95" />
    <polygon points="40,0 40,90 80,30" fill="#f472b6" opacity="0.8" />
    <polygon points="40,0 40,90 0,30" fill="#c084fc" opacity="0.9" />
  </g>

  <!-- Floating Golden Coin 1 -->
  <g transform="translate(680, 420) scale(0.95)" filter="url(#glowGold)">
    <circle cx="35" cy="35" r="35" fill="url(#goldGrad)" />
    <circle cx="35" cy="35" r="28" fill="#ca8a04" stroke="#fef08a" stroke-width="3" />
    <text x="35" y="44" fill="#fef08a" font-size="28" font-weight="900" text-anchor="middle" class="font-sans">★</text>
  </g>

  <!-- Floating Golden Coin 2 -->
  <g transform="translate(1050, 440) scale(1.15)" filter="url(#glowGold)">
    <circle cx="35" cy="35" r="35" fill="url(#goldGrad)" />
    <circle cx="35" cy="35" r="28" fill="#ca8a04" stroke="#fef08a" stroke-width="3" />
    <text x="35" y="44" fill="#fef08a" font-size="26" font-weight="900" text-anchor="middle" class="font-sans">RP</text>
  </g>

  <!-- Floating Discount Voucher Badge Ticket -->
  <g transform="translate(940, 370) rotate(-12)" filter="url(#dropShadow)">
    <rect width="180" height="74" rx="14" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
    <rect x="6" y="6" width="168" height="62" rx="10" fill="#1e1b4b" />
    <text x="90" y="32" fill="#38bdf8" font-size="12" font-weight="900" text-anchor="middle" class="font-sans" letter-spacing="1">VOUCHER DISKON</text>
    <text x="90" y="56" fill="#facc15" font-size="22" font-weight="900" text-anchor="middle" class="font-sans">UP TO 70%</text>
  </g>

  <!-- Cyber Sparkles & Stars -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="670" cy="240" r="3" />
    <circle cx="1080" cy="110" r="4" />
    <circle cx="750" cy="480" r="2.5" />
    <circle cx="1110" cy="310" r="3.5" />
    <circle cx="820" cy="80" r="3" />
  </g>

</svg>
