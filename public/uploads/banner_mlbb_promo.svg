<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="40%" stop-color="#180b38" />
      <stop offset="80%" stop-color="#0b1736" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Neon Glows -->
    <radialGradient id="purpleGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="80%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Text Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Diamond Cyan Gradient -->
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="500" rx="24" fill="url(#bgGrad)" />

  <!-- Atmospheric Glow Overlays -->
  <rect width="1200" height="500" rx="24" fill="url(#purpleGlow)" />
  <rect width="1200" height="500" rx="24" fill="url(#cyanGlow)" />
  <rect width="1200" height="500" rx="24" fill="url(#goldGlow)" />

  <!-- Cyber Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="800" y1="0" x2="800" y2="500" />
    <line x1="1000" y1="0" x2="1000" y2="500" />
  </g>

  <!-- Decorative Geometric Shapes & Particles -->
  <g opacity="0.35">
    <circle cx="150" cy="80" r="3" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="280" cy="420" r="4" fill="#a855f7" filter="url(#glow)" />
    <circle cx="650" cy="70" r="2.5" fill="#facc15" filter="url(#glow)" />
    <circle cx="1100" cy="120" r="4" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="1150" cy="380" r="3" fill="#ec4899" filter="url(#glow)" />
    <polygon points="1050,80 1060,95 1040,95" fill="#a855f7" opacity="0.4" />
    <polygon points="180,380 195,390 185,405" fill="#38bdf8" opacity="0.4" />
  </g>

  <!-- LEFT / CENTER: Promotional Content -->
  <!-- Top Tag / Pill Badge -->
  <g transform="translate(80, 55)">
    <rect width="180" height="34" rx="17" fill="url(#badgeGrad)" filter="url(#glow)" />
    <text x="90" y="22" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="13" text-anchor="middle" letter-spacing="2">🔥 FLASH SALE</text>
  </g>

  <!-- Game Category Subtitle -->
  <text x="80" y="130" fill="#a78bfa" font-family="'Inter', sans-serif" font-weight="800" font-size="16" letter-spacing="3">
    MOBILE LEGENDS: BANG BANG
  </text>

  <!-- Main Headline Title -->
  <text x="80" y="195" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="46" letter-spacing="-1">
    MEGA SALE DIAMOND
  </text>

  <!-- Discount Highlight Ribbon -->
  <g transform="translate(80, 220)">
    <rect width="360" height="54" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-width="2" />
    <text x="20" y="36" fill="url(#goldGrad)" font-family="'Inter', sans-serif" font-weight="900" font-size="28" letter-spacing="0.5">
      DISKON UP TO 35%
    </text>
    <rect x="290" y="12" width="55" height="30" rx="6" fill="#fbbf24" />
    <text x="317" y="32" fill="#000000" font-family="'Inter', sans-serif" font-weight="900" font-size="14" text-anchor="middle">OFF</text>
  </g>

  <!-- Benefit Bullets -->
  <g transform="translate(80, 310)" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">
    <circle cx="8" cy="8" r="4" fill="#38bdf8" />
    <text x="22" y="13">⚡ Proses Instan 1 - 3 Detik</text>
    <circle cx="210" cy="8" r="4" fill="#38bdf8" />
    <text x="224" y="13">🛡️ 100% Legal &amp; Anti Minus</text>
    <circle cx="430" cy="8" r="4" fill="#38bdf8" />
    <text x="444" y="13">🎁 Bonus Weekly Pass</text>
  </g>

  <!-- CTA Button -->
  <g transform="translate(80, 360)">
    <rect width="230" height="54" rx="16" fill="url(#btnGrad)" filter="url(#glow)" />
    <text x="115" y="33" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="15" text-anchor="middle" letter-spacing="1">
      TOP UP SEKARANG ➔
    </text>
  </g>

  <!-- RIGHT SIDE: 3D Diamond & Esports Trophy Illustration -->
  <g transform="translate(760, 40)">
    <!-- Aura Glow behind Diamond -->
    <circle cx="200" cy="210" r="170" fill="#06b6d4" opacity="0.2" filter="url(#superGlow)" />
    <circle cx="200" cy="210" r="120" fill="#8b5cf6" opacity="0.3" filter="url(#superGlow)" />

    <!-- Big Center 3D Diamond -->
    <g transform="translate(90, 70) scale(1.15)">
      <!-- Diamond Top Facets -->
      <polygon points="100,20 155,70 45,70" fill="#e0f2fe" opacity="0.95" />
      <polygon points="45,70 155,70 100,175" fill="#38bdf8" />
      <polygon points="0,70 45,70 100,175" fill="#0284c7" />
      <polygon points="155,70 200,70 100,175" fill="#0369a1" />
      <polygon points="0,70 45,70 30,20" fill="#bae6fd" />
      <polygon points="30,20 45,70 100,20" fill="#7dd3fc" />
      <polygon points="100,20 155,70 170,20" fill="#38bdf8" />
      <polygon points="170,20 155,70 200,70" fill="#0284c7" />
      
      <!-- Inner Sparkle Highlight -->
      <polygon points="85,35 115,35 100,65" fill="#ffffff" opacity="0.8" />
    </g>

    <!-- Small Floating Satellite Diamonds -->
    <g transform="translate(10, 40) scale(0.45) rotate(-15)">
      <polygon points="100,20 155,70 45,70" fill="#e0f2fe" />
      <polygon points="45,70 155,70 100,175" fill="#38bdf8" />
      <polygon points="0,70 45,70 100,175" fill="#0284c7" />
      <polygon points="155,70 200,70 100,175" fill="#0369a1" />
    </g>

    <g transform="translate(320, 180) scale(0.55) rotate(20)">
      <polygon points="100,20 155,70 45,70" fill="#fef08a" />
      <polygon points="45,70 155,70 100,175" fill="#f59e0b" />
      <polygon points="0,70 45,70 100,175" fill="#d97706" />
      <polygon points="155,70 200,70 100,175" fill="#b45309" />
    </g>

    <g transform="translate(40, 260) scale(0.4) rotate(10)">
      <polygon points="100,20 155,70 45,70" fill="#e0f2fe" />
      <polygon points="45,70 155,70 100,175" fill="#38bdf8" />
      <polygon points="0,70 45,70 100,175" fill="#0284c7" />
      <polygon points="155,70 200,70 100,175" fill="#0369a1" />
    </g>

    <!-- Glowing Stars -->
    <path d="M 210,40 Q 210,65 235,65 Q 210,65 210,90 Q 210,65 185,65 Q 210,65 210,40" fill="#ffffff" filter="url(#glow)" />
    <path d="M 70,180 Q 70,195 85,195 Q 70,195 70,210 Q 70,195 55,195 Q 70,195 70,180" fill="#fde047" filter="url(#glow)" />
    <path d="M 330,80 Q 330,95 345,95 Q 330,95 330,110 Q 330,95 315,95 Q 330,95 330,80" fill="#38bdf8" filter="url(#glow)" />
  </g>
</svg>
