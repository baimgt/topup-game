<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <!-- Tactical PUBG Background Gradients -->
    <linearGradient id="pubgBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02140a" />
      <stop offset="40%" stop-color="#062e19" />
      <stop offset="80%" stop-color="#0a1f13" />
      <stop offset="100%" stop-color="#020804" />
    </linearGradient>

    <!-- Emerald / Military Gold Glows -->
    <radialGradient id="emeraldGlow" cx="25%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="pubgGoldGlow" cx="75%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- PUBG Gold Text Gradient -->
    <linearGradient id="pubgGoldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- PUBG Button Gradient -->
    <linearGradient id="pubgBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="pubgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="pubgSuperGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="500" rx="24" fill="url(#pubgBgGrad)" />

  <!-- Emerald & Gold Glow Overlays -->
  <rect width="1200" height="500" rx="24" fill="url(#emeraldGlow)" />
  <rect width="1200" height="500" rx="24" fill="url(#pubgGoldGlow)" />

  <!-- Tactical Hexagonal / Military Grid -->
  <g opacity="0.08" stroke="#10b981" stroke-width="1.5">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="380" x2="1200" y2="380" />
    <line x1="150" y1="0" x2="150" y2="500" />
    <line x1="350" y1="0" x2="350" y2="500" />
    <line x1="550" y1="0" x2="550" y2="500" />
    <line x1="750" y1="0" x2="750" y2="500" />
    <line x1="950" y1="0" x2="950" y2="500" />
    <line x1="1150" y1="0" x2="1150" y2="500" />
  </g>

  <!-- Golden Dust Particles -->
  <g opacity="0.5">
    <circle cx="180" cy="110" r="3" fill="#fde047" filter="url(#pubgGlow)" />
    <circle cx="320" cy="410" r="4" fill="#10b981" filter="url(#pubgGlow)" />
    <circle cx="610" cy="80" r="2.5" fill="#fbbf24" filter="url(#pubgGlow)" />
    <circle cx="1090" cy="120" r="3.5" fill="#f59e0b" filter="url(#pubgGlow)" />
    <circle cx="1130" cy="390" r="4" fill="#10b981" filter="url(#pubgGlow)" />
  </g>

  <!-- LEFT / CENTER: Promotional Content -->
  <!-- Top Tag / Pill Badge -->
  <g transform="translate(80, 55)">
    <rect width="210" height="34" rx="17" fill="#065f46" stroke="#10b981" stroke-width="1.5" filter="url(#pubgGlow)" />
    <text x="105" y="22" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="13" text-anchor="middle" letter-spacing="2">🎯 SPECIAL DEAL PUBG</text>
  </g>

  <!-- Game Category Subtitle -->
  <text x="80" y="130" fill="#34d399" font-family="'Inter', sans-serif" font-weight="800" font-size="16" letter-spacing="3">
    PUBG MOBILE • UNKNOWN CASH (UC)
  </text>

  <!-- Main Headline Title -->
  <text x="80" y="195" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="46" letter-spacing="-1">
    PROMO SPESIAL UC
  </text>

  <!-- Discount Highlight Ribbon -->
  <g transform="translate(80, 220)">
    <rect width="380" height="54" rx="12" fill="#042312" stroke="#10b981" stroke-width="2" />
    <text x="20" y="36" fill="url(#pubgGoldText)" font-family="'Inter', sans-serif" font-weight="900" font-size="26" letter-spacing="0.5">
      EXTRA BONUS UC + 25%
    </text>
    <rect x="310" y="12" width="55" height="30" rx="6" fill="#f59e0b" />
    <text x="337" y="32" fill="#000000" font-family="'Inter', sans-serif" font-weight="900" font-size="14" text-anchor="middle">BEST</text>
  </g>

  <!-- Benefit Bullets -->
  <g transform="translate(80, 310)" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#a7f3d0">
    <circle cx="8" cy="8" r="4" fill="#10b981" />
    <text x="22" y="13">⚡ Proses Otomatis 24 Jam</text>
    <circle cx="220" cy="8" r="4" fill="#10b981" />
    <text x="234" y="13">🛡️ Legal &amp; Anti Banned</text>
    <circle cx="430" cy="8" r="4" fill="#10b981" />
    <text x="444" y="13">🎁 Royale Pass Murah</text>
  </g>

  <!-- CTA Button -->
  <g transform="translate(80, 360)">
    <rect width="230" height="54" rx="16" fill="url(#pubgBtnGrad)" filter="url(#pubgGlow)" />
    <text x="115" y="33" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="15" text-anchor="middle" letter-spacing="1">
      TOP UP PUBG UC ➔
    </text>
  </g>

  <!-- RIGHT SIDE: Tactical Spetsnaz Helmet & Golden UC Coins -->
  <g transform="translate(760, 40)">
    <!-- Golden Emerald Aura Glow -->
    <circle cx="200" cy="210" r="160" fill="#f59e0b" opacity="0.25" filter="url(#pubgSuperGlow)" />
    <circle cx="200" cy="210" r="110" fill="#10b981" opacity="0.3" filter="url(#pubgSuperGlow)" />

    <!-- Level 3 Spetsnaz Helmet Illustration -->
    <g transform="translate(80, 50) scale(1.15)">
      <!-- Helmet Dome -->
      <path d="M 60,110 C 60,40 180,40 180,110 L 180,160 C 180,180 60,180 60,160 Z" fill="#1f2937" stroke="#374151" stroke-width="4" />
      <path d="M 70,105 C 70,55 170,55 170,105 L 170,145 C 170,165 70,165 70,145 Z" fill="#111827" />

      <!-- Steel Visor Face Shield (with slit) -->
      <path d="M 50,110 L 190,110 L 180,170 L 60,170 Z" fill="#374151" stroke="#4b5563" stroke-width="2" />
      <rect x="75" y="125" width="90" height="16" rx="4" fill="#000000" stroke="#f59e0b" stroke-width="1.5" />
      <line x1="80" y1="133" x2="160" y2="133" stroke="#f59e0b" stroke-width="2" opacity="0.8" />

      <!-- Helmet Rivets / Bolts -->
      <circle cx="58" cy="115" r="4" fill="#9ca3af" />
      <circle cx="182" cy="115" r="4" fill="#9ca3af" />
      <circle cx="120" cy="55" r="3" fill="#9ca3af" />
    </g>

    <!-- Golden UC (Unknown Cash) Medallion Coins -->
    <g transform="translate(180, 180) scale(1.1)">
      <!-- Back Coin -->
      <circle cx="80" cy="80" r="45" fill="#d97706" stroke="#fbbf24" stroke-width="3" />
      <circle cx="80" cy="80" r="38" fill="#f59e0b" />
      <text x="80" y="89" fill="#78350f" font-family="'Inter', sans-serif" font-weight="900" font-size="26" text-anchor="middle">UC</text>

      <!-- Front Coin -->
      <circle cx="45" cy="110" r="48" fill="#f59e0b" stroke="#fef08a" stroke-width="3" filter="url(#pubgGlow)" />
      <circle cx="45" cy="110" r="40" fill="#fbbf24" />
      <circle cx="45" cy="110" r="34" fill="#f59e0b" />
      <text x="45" y="121" fill="#78350f" font-family="'Inter', sans-serif" font-weight="900" font-size="30" text-anchor="middle">UC</text>
    </g>

    <!-- Glowing Stars -->
    <path d="M 210,30 Q 210,50 225,50 Q 210,50 210,70 Q 210,50 195,50 Q 210,50 210,30" fill="#fef08a" filter="url(#pubgGlow)" />
    <path d="M 70,160 Q 70,175 85,175 Q 70,175 70,190 Q 70,175 55,175 Q 70,175 70,160" fill="#34d399" filter="url(#pubgGlow)" />
  </g>
</svg>
